name: Picolibc Build and Test

on:
  pull_request:

env:
  # The Picolibc toolchain is the pkw release of PICOLIBC_TOOLS (see the resolve step).
  # The job copies it without the Dinkumware sysroots (see the toolchain step), so a
  # build that misses --cstdlib=picolibc fails instead of silently using them.
  PICOLIBC_TOOLS: "23.0"
  PKW_BIN: /prj/qct/coredev/hexagon/sitelinks/arch/bin
  # The runner's pkw wrapper otherwise picks git 2.15.1 for actions/checkout, whose
  # libcurl is broken there.  Same pin as h2_future_reg.yml.
  PKW_VERSIONS: "git=2.38.0"

jobs:
  picolibc-build-and-test:
    name: Picolibc Build and Test
    runs-on: [ self-hosted, Linux, X64 ]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check GNU make version
        run: |
          ver="$(/usr/bin/make --version | sed -n '1s/.* \([0-9][0-9.]*\).*/\1/p')"
          [[ "$(printf '%s\n' 4.2 "$ver" | sort -V | head -1)" == "4.2" ]] \
            || { echo "GNU make >= 4.2 required, found $ver"; exit 1; }

      - name: Resolve the Picolibc toolchain with pkw
        run: |
          clang="$(PKW_VERSIONS="hexagon-tools=$PICOLIBC_TOOLS" "$PKW_BIN/pkw" --which hexagon-clang | tail -n 1)"
          test -x "$clang"
          version="$("$clang" --version | sed -n '1p')"
          echo "$version"
          case "$version" in *"version $PICOLIBC_TOOLS"*) ;; *) echo "expected $PICOLIBC_TOOLS, got: $version"; exit 1 ;; esac
          echo "TOOLCHAIN_SRC=$(dirname "$(dirname "$clang")")" >> "$GITHUB_ENV"

      - name: Create Picolibc toolchain
        run: |
          src="$TOOLCHAIN_SRC"
          # RUNNER_TEMP is under the runner's _work directory, next to the checkout.  /tmp is
          # local to the runner host, and a job that runs on another host cannot read it.
          dest="$(mktemp -d "$RUNNER_TEMP/picolibc-toolchain.XXXXXX")"
          echo "PICOLIBC_TOOLCHAIN=$dest" >> "$GITHUB_ENV"
          # Copy the toolchain without its Dinkumware sysroots, so a build that
          # misses --cstdlib=picolibc fails instead of silently using them.
          tar -C "$src" \
            --exclude=./target/hexagon \
            --exclude=./target/hexagon-unknown-qurt-dw \
            --exclude=./target/qnx \
            -cf - . | tar -C "$dest" -xf -
          test -x "$dest/bin/hexagon-clang"
          test -f "$dest/templates/staticExecutable/static-executable-h2-picolibc.lcs.template"
          test -d "$dest/target/picolibc"
          for t in hexagon hexagon-unknown-qurt-dw qnx; do test ! -e "$dest/target/$t"; done

      - name: Clean Picolibc artifacts
        run: rm -rf artifacts_picolibc

      - name: Regression test
        run: |
          # archsim needs --magic_angel for every variant (the Makefile sets it only for
          # opt_si).  TOOLS_FLAVOR and TOOLS_FLAVOR_KERNEL select the pkw tools for every
          # ARCHV and for the kernel.  BATCH=1 runs each build and test as a bsub -I job,
          # as h2_future_reg does.  IGNOREFAIL=1 keeps the report and the check step as
          # the gate.
          PATH="$PKW_BIN:$PATH" /usr/bin/make -O BATCH=1 USE_PKW=1 NULL_ANGEL_TRAP=1 \
            MAGIC_ANGEL=--magic_angel PICOLIBC=1 IGNOREFAIL=1 \
            TOOLS_FLAVOR="$PICOLIBC_TOOLS" TOOLS_FLAVOR_KERNEL="$PICOLIBC_TOOLS" \
            TOOLCHAIN_BIN="$PICOLIBC_TOOLCHAIN/bin" testall

      - name: Check test results
        run: |
          summary=artifacts_picolibc/test.out
          test -f "$summary" || { echo "no test summary at $summary"; exit 1; }
          grep '^SUMMARY:' "$summary" || true
          # The expected numbers come from make's configuration, not from this file.
          archs="$(/usr/bin/make -s -f makefile.real PICOLIBC=1 printvar-ARCHV_LIST | cut -d= -f2)"
          variants="$(/usr/bin/make -s -f makefile.real PICOLIBC=1 printvar-VARIANTS | cut -d= -f2)"
          [[ -n "$archs" && -n "$variants" ]] || { echo "make reports no ARCHV_LIST or VARIANTS"; exit 1; }
          nvariants=$(( $(wc -w <<< "$archs") * $(wc -w <<< "$variants") ))
          ntests=0
          for a in $archs; do
            ntests=$(( ntests + $(perl -p -e 's/\s*\#.*//;' "scripts/testlist.v$a" | grep -c '\S') ))
          done
          expected=$(( ntests * $(wc -w <<< "$variants") ))
          failed="$(sed -n 's/^SUMMARY: [0-9]* passed, \([0-9]*\) failed.*/\1/p' "$summary")"
          passed="$(sed -n 's/^SUMMARY: \([0-9]*\) passed, .*/\1/p' "$summary")"
          reported="$(sed -n 's/^SUMMARY: .* across \([0-9]*\) variant.*/\1/p' "$summary")"
          if [[ "${failed:-1}" -ne 0 ]]; then
              grep '^    FAILED' "$summary" || true
              echo "${failed} test(s) failed"
              exit 1
          fi
          if [[ "${reported:-0}" -ne "$nvariants" ]]; then
              echo "${reported:-0} variant(s) reported, expected $nvariants"
              exit 1
          fi
          if [[ "${passed:-0}" -ne "$expected" ]]; then
              echo "${passed:-0} test(s) passed, expected $expected"
              exit 1
          fi

      - name: Remove toolchain copy
        if: always()
        run: |
          if [ -n "${PICOLIBC_TOOLCHAIN:-}" ]; then rm -rf "$PICOLIBC_TOOLCHAIN"; fi
